[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "deadliner-quickadd-training"
version = "0.1.0"
requires-python = ">=3.12"
description = "Kivo on-device quick-add model training and KMP evaluation"
dependencies = []
[project.optional-dependencies]
train = ["torch==2.7.0", "numpy==1.26.4", "onnx==1.18.0", "onnxruntime==1.22.0"]
teacher = ["transformers==4.57.1", "huggingface-hub==0.36.2", "sentencepiece==0.2.1", "protobuf==6.33.0"]
coreml = ["coremltools==8.3.0"]
[tool.setuptools.packages.find]
where = ["src"]
