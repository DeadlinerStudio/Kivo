name: Evaluation contract
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU training and evaluation dependencies
        run: |
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,teacher]'
      - run: |
          for corpus in data data/zh data/en data/zh-challenge data/en-challenge; do
            PYTHONPATH=src python -m quickadd_training.validate "$corpus"
          done
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python tools/check_joint_corpus.py
